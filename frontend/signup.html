<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - LocalBiz</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="auth-layout">
        <div class="auth-main">
            <div class="auth-header">
                <nav class="auth-nav">
                    <a href="index.html" class="nav-link">← Back to Home</a>
                    <a href="login.html" class="nav-link">Sign In</a>
                </nav>
            </div>

            <div class="auth-content">
                <div class="auth-form-container">
                    <div class="auth-form-header">
                        <h1>Create your account</h1>
                        <p>Join LocalBiz and grow your business</p>
                    </div>

                    <form class="modern-form" id="signupForm">
                        <div class="form-group">
                            <label for="name">Full Name</label>
                            <input type="text" id="name" placeholder="Enter your name" required>
                        </div>

                        <div class="form-group">
                            <label for="email">Email Address</label>
                            <input type="email" id="email" placeholder="Enter your email" required>
                        </div>

                        <div class="form-group">
                            <label for="password">Password</label>
                            <input type="password" id="password" placeholder="Create a password" required>
                        </div>

                        <div class="form-group">
                            <label for="role">I am a</label>
                            <select id="role" required>
                                <option value="business">Business Owner</option>
                                <option value="customer">Customer</option>
                            </select>
                        </div>

                        <button style="background: rgba(255, 255, 255, 0.1);" type="submit" class="btn btn-primary btn-full">Create Account</button>
                    </form>

                    <div class="auth-footer">
                        <p>Already have an account? <a href="login.html">Sign in</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="js/auth.js"></script>
    <script>
        document.getElementById('signupForm').addEventListener('submit', handleSignup);
    </script>
</body>

</html>
